<!doctype html>
<!-- Template for chapter pages. build.py fills the {{...}} slots from chapters/*.md -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Psychophysics for Vision-Language Models</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <div class="chapter-head">
    <a class="back" href="index.html" aria-label="Back to all chapters">&lsaquo;</a>
    <h1 class="chapter-title">{{title}}</h1>
    <div class="view-switch" data-view="article" role="group" aria-label="View">
      <span class="thumb"></span>
      <button type="button" data-view="article" aria-pressed="true">Article</button>
      <button type="button" data-view="notebook" aria-pressed="false">Notebook</button>
    </div>
  </div>

  <div class="chapter-layout">
    <div class="stage">

      <!-- ================= ARTICLE ================= -->
      <article class="face article" id="article">
{{article}}
      </article>

      <!-- ================= NOTEBOOK ================= -->
      <div class="face notebook" id="notebook" hidden>
{{notebook}}
      </div>

    </div>
  </div>
</main>

<footer class="site-footer">
  <span>Doğukan Nami Öztaş</span>
  <span>Code and data on GitHub</span>
</footer>

<script src="site.js"></script>
<script src="demos.js"></script>
</body>
</html>
